<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг открытия смен</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        h1 { text-align: center; color: #222; margin-bottom: 30px; font-size: 28px; }
        .header-info { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 20px; font-size: 14px; color: #777; }
        .update-btn { background-color: #333; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .update-btn:hover { background-color: #555; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        
        .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 6px solid #e0e0e0; display: flex; flex-direction: column; }
        .card.open { border-left-color: #198754; } /* Зеленая полоска */
        
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 12px; }
        .card-status { font-size: 15px; font-weight: bold; margin-bottom: 15px; color: #198754; display: flex; align-items: center; gap: 5px; }
        .card-status.closed { color: #dc3545; }
        
        .card-details { font-size: 13px; color: #555; margin-bottom: 20px; flex-grow: 1; line-height: 1.6; }
        
        .btn-primary { background-color: #0d6efd; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 14px; font-weight: bold; transition: 0.2s; }
        .btn-primary:hover { background-color: #0b5ed7; }
        .btn-primary:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        @media (max-width: 600px) {
            .header-info { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>

    <h1>Мониторинг открытия смен</h1>
    
    <div class="header-info">
        <span id="last-update">Последнее обновление: загрузка...</span>
        <button class="update-btn" onclick="loadData()">Обновить сейчас</button>
    </div>
    
    <div class="grid" id="dashboard"></div>

    <script>
        // !!! СЮДА НУЖНО ВСТАВИТЬ ВАШУ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT !!!
        const WEB_APP_URL = "ВСТАВЬТЕ_ВАШУ_ССЫЛКУ_НА_СКРИПТ_ЗДЕСЬ"; 
        
        const schedule = {
            "Медведково": "08:00", "Трудобелики": "09:00", "Котельники": "09:00", "Королёв": "09:00",
            "Южный": "09:00", "Лента": "09:00", "Мира": "09:00", "Краснодар": "09:00",
            "Реутов": "10:00", "Метрополис": "10:00", "Европолис Вход": "10:00", "Европолис Окей": "10:00"
        };

        async function loadData() {
            const dashboard = document.getElementById('dashboard');
            document.getElementById('last-update').innerText = "Обновление данных...";
            
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json(); 
                
                // Формируем сегодняшнюю дату в формате dd.MM.yyyy
                const todayObj = new Date();
                const day = String(todayObj.getDate()).padStart(2, '0');
                const month = String(todayObj.getMonth() + 1).padStart(2, '0');
                const year = todayObj.getFullYear();
                const todayStr = `${day}.${month}.${year}`;
                
                const todayData = data.filter(row => row[0] === todayStr);
                
                dashboard.innerHTML = "";
                
                Object.keys(schedule).forEach(shop => {
                    // Берем самую последнюю запись для конкретного магазина за сегодня
                    const shopLog = todayData.reverse().find(row => row[2] === shop); 
                    
                    const card = document.createElement('div');
                    card.className = "card" + (shopLog ? " open" : "");
                    
                    let statusHtml = "";
                    let detailsHtml = "";
                    let btnHtml = "";
                    
                    if (shopLog) {
                        statusHtml = `<div class="card-status">☑️ Открыт в ${shopLog[1]}</div>`;
                        detailsHtml = `Сотрудник: <b>${shopLog[5]}</b><br>По графику: ${schedule[shop]}`;
                        // Открываем чек в новой вкладке через window.open
                        btnHtml = `<button class="btn-primary" onclick="window.open('${shopLog[4]}', '_blank')">Посмотреть чек</button>`;
                    } else {
                        statusHtml = `<div class="card-status closed">❌ Ждем открытия</div>`;
                        detailsHtml = `Сотрудник: —<br>По графику: ${schedule[shop]}`;
                        btnHtml = `<button class="btn-primary" disabled>Чек не загружен</button>`;
                    }
                    
                    card.innerHTML = `
                        <div class="card-title">${shop}</div>
                        ${statusHtml}
                        <div class="card-details">${detailsHtml}</div>
                        ${btnHtml}
                    `;
                    dashboard.appendChild(card);
                });
                
                const now = new Date();
                document.getElementById('last-update').innerText = "Последнее обновление: " + now.toLocaleTimeString('ru-RU');
                
            } catch (error) {
                document.getElementById('last-update').innerText = "Ошибка загрузки. Проверьте ссылку.";
            }
        }

        // Запускаем при открытии страницы
        loadData();
        
        // Автоматически обновляем данные каждые 2 минуты
        setInterval(loadData, 120000);
    </script>
</body>
</html>
